[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modern-math-for-llm-engineering"
version = "0.2.2"
description = "Reproducible experiments applying modern mathematics to practical LLM and AI processes."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
hf = [
    "sentence-transformers>=3.0",
]

[tool.setuptools]
py-modules = []
